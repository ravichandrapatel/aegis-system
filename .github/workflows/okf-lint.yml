# file_name: okf-lint.yml
# description: CI gate — run okf.py lint (incl. standards Prompt Card check) + smoke tests.
# version: 0.2.0
# authors: contributors
name: OKF lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  okf-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Lint vault (Prompt Card gate)
        working-directory: .
        run: python3 _okf_knowledge/kernel/okf.py lint

      - name: Kernel smoke tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
