# file_name: okf-lint.yml
# description: CI gate — okf.py compile/lint, skill sync drift check, kernel tests.
# version: 0.3.0
# authors: contributors
name: OKF lint

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  okf-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Compile brain (fails if artifacts are stale)
        run: |
          set -euo pipefail
          python3 _okf_knowledge/kernel/okf.py compile
          git diff --exit-code -- _okf_knowledge/index.json \
            _okf_knowledge/prompt_cards.json \
            _okf_knowledge/graph.json

      - name: Lint vault (Prompt Card gate)
        run: python3 _okf_knowledge/kernel/okf.py lint

      - name: Skill sync drift check
        run: python3 tools/sync_skills.py --check

      - name: Kernel tests (smoke + retrieval quality)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
