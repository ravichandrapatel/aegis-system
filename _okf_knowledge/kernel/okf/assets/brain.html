<!DOCTYPE html>
<!--
file_name: brain.html
description: Self-contained OKF bundle graph (okf-brain). No backend, no CDN, no
             dependencies. Graph + lint payloads are embedded here by
             _okf_knowledge/kernel/okf.py compile / lint; compile also writes graph.json at the
             brain root for lookup hop-boost and GET /graph.json when served.
             Serve is read-only — refresh embeds via CLI compile/lint, then reload.
             Features: force graph, declutter panel (labels/orphans/local
             graph), type legend, navigator sidebar, and lint panel.
version: 0.2.11
authors: contributors
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>okf knowledge system</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #202020;
      --panel2: #262626;
      --text: #dadada;
      --muted: #8a8a8a;
      --accent: #7f6df2;
      --border: #333;
      --error: #f26d78;
      --warning: #f0c674;
      --sidebar-w: 300px;
      --topbar-h: 46px;
      --reader-w: 440px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 10;
      height: 46px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    #topbar h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      white-space: nowrap;
    }

    #topbar h1 span {
      color: var(--accent);
    }

    #legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      overflow: hidden;
    }

    .key {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 9px;
      background: var(--panel2);
      transition: opacity .15s;
    }

    .key:hover {
      border-color: #3a4157;
    }

    .key.off {
      opacity: 0.35;
      text-decoration: line-through;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: none;
    }

    #load {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    #status {
      color: var(--muted);
      font-size: 12px;
    }

    .tb-btn {
      cursor: pointer;
      background: #232838;
      color: var(--text);
      border: 1px solid #313749;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .tb-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tb-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    #side {
      position: fixed;
      top: 46px;
      left: 0;
      bottom: 0;
      width: 300px;
      z-index: 9;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: hidden; /* clip; navlist scrolls inside */
    }

    #searchbox {
      flex: none;
      padding: 10px 12px 6px;
    }

    #searchbox input {
      width: 100%;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #313749;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }

    #searchbox input:focus {
      border-color: var(--accent);
    }

    #navlist {
      flex: 1 1 auto;
      min-height: 0; /* required for flex child overflow scroll */
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 4px 6px 8px;
      /* Shared tree columns: chevron/bullet | label | mark */
      --nav-cols: 14px minmax(0, 1fr) auto;
      --nav-gap: 3px;
      --nav-indent: 12px;
      scrollbar-width: thin;
      scrollbar-color: #4a4a4a var(--panel2);
    }

    #navlist::-webkit-scrollbar {
      width: 8px;
    }

    #navlist::-webkit-scrollbar-track {
      background: var(--panel2);
    }

    #navlist::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 4px;
    }

    #navlist::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }

    .navgroup summary,
    .navitem {
      display: grid;
      grid-template-columns: var(--nav-cols);
      column-gap: var(--nav-gap);
      align-items: center;
      box-sizing: border-box;
      padding: 5px 10px 5px calc(6px + (var(--depth, 0) * var(--nav-indent)));
      min-height: 26px;
    }

    .navgroup summary {
      cursor: pointer;
      list-style: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .4px;
      user-select: none;
    }

    .navgroup summary::-webkit-details-marker {
      display: none;
    }

    .navgroup summary::before {
      content: "";
      grid-column: 1;
      width: 14px;
      height: 14px;
      justify-self: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Expand arrow only when the folder/zone has nested folders or files */
    .navgroup.has-children>summary::before {
      content: "▸";
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      transition: transform .12s;
    }

    .navgroup.has-children[open]>summary::before {
      transform: rotate(90deg);
    }

    .navgroup.zone-group {
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
      padding-bottom: 6px;
    }

    .navgroup.zone-group>summary {
      color: var(--accent);
      font-size: 14px;
    }

    .navgroup.folder-group>summary {
      color: #fff;
      font-size: 12px;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 600;
    }

    .navgroup summary .nav-label {
      grid-column: 2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .navitem {
      cursor: pointer;
      border-radius: 6px;
      font-size: 13px;
      color: #fff;
    }

    .navitem:hover {
      background: var(--panel2);
    }

    .navitem.selected {
      background: #23304d;
    }

    .navitem .bullet {
      grid-column: 1;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      justify-self: center;
    }

    .navitem .nav-label {
      grid-column: 2;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .navitem .mark {
      grid-column: 3;
      font-size: 12px;
    }

    .tb-status {
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }

    .tb-status .cnt.err {
      color: var(--error);
    }

    .tb-status .cnt.warn {
      color: var(--warning);
    }

    .tb-status .cnt.ok {
      color: #a3d977;
    }

    .tb-status .cnt.idle {
      color: var(--muted);
      font-weight: 500;
    }

    #reader {
      position: fixed;
      top: 46px;
      right: 0;
      bottom: 0;
      width: 440px;
      z-index: 9;
      display: none;
      flex-direction: column;
      background: var(--panel);
      border-left: 1px solid var(--border);
    }

    #r-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px 4px;
      border-bottom: 1px solid var(--border);
    }

    #r-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }

    #r-close {
      cursor: pointer;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 15px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    #r-close:hover {
      background: var(--panel2);
      color: var(--text);
    }

    #r-meta {
      padding: 0 14px 10px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }

    #r-meta .tag {
      display: inline-block;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 8px;
      margin: 2px 3px 0 0;
      font-size: 11px;
    }

    #r-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
      font-size: 13px;
    }

    #r-body h1 {
      font-size: 15px;
      margin: 16px 0 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    #r-body h2 {
      font-size: 14px;
      margin: 14px 0 5px;
    }

    #r-body h3,
    #r-body h4 {
      font-size: 13px;
      margin: 12px 0 4px;
    }

    #r-body p {
      margin: 6px 0;
    }

    #r-body ul,
    #r-body ol {
      margin: 6px 0;
      padding-left: 1.5em;
      list-style-position: outside;
    }

    #r-body li {
      margin: 3px 0;
    }

    #r-body li>ul,
    #r-body li>ol {
      margin: 4px 0 2px;
      padding-left: 1.5em;
    }

    #r-body .li-cont {
      display: block;
      margin: 2px 0 0 1em;
    }

    #r-body code {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 4px;
      font-size: 12px;
    }

    #r-body pre {
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 12px;
    }

    #r-body pre code {
      background: none;
      border: none;
      padding: 0;
    }

    #r-body table {
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
    }

    #r-body th,
    #r-body td {
      border: 1px solid var(--border);
      padding: 4px 8px;
      text-align: left;
    }

    #r-body th {
      background: var(--panel2);
    }

    #r-body a {
      color: var(--accent);
      text-decoration: none;
    }

    #r-body a:hover {
      text-decoration: underline;
    }

    #r-body a.dead {
      color: var(--muted);
      border-bottom: 1px dashed var(--muted);
      cursor: help;
    }

    canvas#c {
      position: fixed;
      z-index: 1;
      top: var(--topbar-h);
      left: var(--sidebar-w);
      right: 0;
      bottom: 0;
      display: block;
      background: var(--bg);
      /* Avoid browser upscaling blur; JS sets the real backing-store size. */
      image-rendering: auto;
    }

    body.reader-open canvas#c {
      right: var(--reader-w);
    }

    #tip {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      display: none;
      background: var(--panel);
      border: 1px solid #313749;
      border-radius: 8px;
      padding: 8px 12px;
      max-width: 340px;
      font-size: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .5);
    }

    #tip .t-title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    #tip .t-meta {
      color: var(--muted);
    }

    #tip .t-lint.error {
      color: var(--error);
    }

    #tip .t-lint.warning {
      color: var(--warning);
    }

    /* Floating graph controls */
    #declutter {
      position: fixed;
      z-index: 8;
      right: 16px;
      bottom: 16px;
      width: 220px;
      background: rgba(32, 32, 32, 0.92);
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      padding: 10px 12px 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .45);
      font-size: 12px;
      color: var(--text);
    }

    body.reader-open #declutter {
      right: calc(var(--reader-w) + 16px);
    }

    #declutter h2 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #declutter label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      user-select: none;
      color: var(--text);
    }

    #declutter label:hover {
      color: #fff;
    }

    #declutter input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
    }

    #declutter .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 0;
    }

    #declutter select {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
    }

    #declutter .hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>

  <div id="topbar">
    <h1>okf knowledge system</h1>

      <span id="status">loading…</span>

    <div id="navlist"></div>
  </div>
  <canvas id="c"></canvas>
  <div id="declutter">
    <h2>Declutter</h2>
    <div class="row">
      <span>Labels</span>
      <select id="opt-labels" title="When to show node titles">
        <option value="hover">On hover</option>
        <option value="selection">Selection</option>

  <div id="tip"></div>
  <div id="reader">
    <div id="r-head">

    <div id="r-meta"></div>
    <div id="r-body"></div>
  </div>
  <!-- Data embedded by _okf_knowledge/kernel/okf.py compile and _okf_knowledge/kernel/okf.py lint so
     okf-brain auto-loads even when opened as file:// (where fetch is blocked). -->
  <script id="graph-data" type="application/json">{
  "nodes": [
    {
      "id": "standards/ide-context-guardrails",
      "type": "Concept",
      "title": "IDE Context Guardrails",
      "description": "Binding rules to stop IDE token bloat and drift \u2014 no @workspace, pack-first cards, rg over legacy search.",
      "tags": [
        "standard",
        "okf",
        "tokens",
        "ide",
        "copilot",
        "cursor",
        "drift"
      ],
      "content": "# IDE Context Guardrails\n\nStops **token inflation** and **context drift** in Copilot / Cursor / VS Code when an OKF brain is present. Complements [OKF Prompt Injection](okf-prompt-injection.md) (Rule #1).\n\n## MUST\n\n1. **Explicit scope only** \u2014 Name paths, `@file`, or pack/lookup results. **FORBIDDEN:** `@workspace`, \u201csearch the whole repo\u201d, or other broad workspace dumps as the primary retrieval move when Brain is enabled.\n2. **Pack before corpus** \u2014 Non-trivial tasks: `okf.py pack` once (it reports capabilities in the same output); inject **only** `## Prompt Card` text. Do not paste `index.json`, `graph.json`, or full vault/standard bodies. An empty pack ends the retrieval attempt \u2014 do not re-query for a hit.\n3. **Prefer `rg` (ripgrep)** \u2014 `okf.py` lookup cache-miss and IDE file search use **ripgrep only**. **FORBIDDEN:** legacy `grep`/`egrep` as the search backend when `rg` is available.\n4. **Preserve grill-me** \u2014 Do **not** impose hard chat turn caps that abort challenge-response design reviews. Multi-turn vetting is intentional.\n\n## SHOULD\n\n1. Close unused editor tabs / buffers before long agent sessions so background scanners do not pull idle files into context (e.g. IDE \u201cclose all\u201d / `code --close` when that CLI is available).\n2. Prefer short, new threads for unrelated tasks over one unbounded chat that re-injects stale tool noise.\n3. Keep script/`okf.py` stdout hyper-compressed (JSON pointers / card text) \u2014 no conversational wrapper in tool output meant for the model.\n\n## Local cache contract\n\n| Artifact | Role |\n| --- | --- |\n| `index.json` (v2 + inverted) | Keyword \u2192 concept pointers (ms lookup) |\n| `prompt_cards.json` | Pre-extracted cards for pack |\n| `.okf-compile-cache.json` | Incremental compile cache |\n\nRebuild with `python3 _okf_knowledge/kernel/okf.py compile`. **JSON** is the on-disk/LLM-facing cache format (native parse weights); do not replace pack payloads with exotic serializations for \u201ctoken savings.\u201d\n\n## Prompt Card\n\n```text\nIDE: no @workspace / broad workspace dump when Brain on \u2014 pack cards only.\nPack once per task (it prints caps too); empty pack is final, do not re-query.\nLookup: JSON inverted hit \u2192 else ripgrep (rg), never grep; then Prompt Cards.\nNo hard turn-cap killing grill-me; close idle tabs when possible.\n```\n\n# Related\n\n- [OKF Prompt Injection](okf-prompt-injection.md)\n- [OKF Cognitive Bundle](/vault/concepts/okf-cognitive-bundle.md)\n- DNA: [AGENTS.md](/AGENTS.md)"
    },
    {
      "id": "standards/metadata-headers",
      "type": "Concept",
      "title": "Metadata Headers",
      "description": "Required metadata blocks on new okf package modules and house scripts.",
      "tags": [
        "standard",
        "code-quality",
        "documentation",
        "conventions",
        "python"
      ],
      "content": "# Metadata Headers\n\n**Scope:** new/edited files under `_okf_knowledge/kernel/okf/` and other house Python tooling. Domain YAML/code follows this repo\u2019s domain standards when present.\n\n**Identifier style** is binding under [Python Naming](/standards/python-naming.md) and enforced by `okf.py lint` \u2014 do not invent a second convention here.\n\n## File header\n\n```python\n# file_name: okf.py\n# description: Thin CLI caller for the OKF runtime package.\n# version: 1.3.0\n# authors: contributors\n```\n\nHeader keys are `lower_snake` only (`file_name`, not `FILE_NAME`).\n\n## Function / class docstring fields\n\n`intent`, `input`, `output`, `role`, `side_effects` (snake_case) \u2014 match existing package style.\n\n## Prompt Card\n\n```text\nHouse Python headers: file_name/description/version/authors (lower_snake keys).\nDocstrings: intent, input, output, role, side_effects.\nIdentifier style: standards/python-naming.md (lint DBG-320/321).\n```\n\n# Related\n\n- [Python Naming](/standards/python-naming.md)\n- [Simplicity First](/standards/simplicity-first.md)\n- [OKF House Schema](/standards/okf-house-schema.md)"
    },
    {
      "id": "standards/okf-house-schema",
      "type": "Concept",
      "title": "OKF House Schema",
      "description": "Required frontmatter and Prompt Card rules for durable OKF documents.",
      "tags": [
        "standard",
        "okf",
        "schema",
        "frontmatter"
      ],
      "content": "# OKF House Schema\n\nBinding schema for durable docs under `_okf_knowledge/`, targeting **OKF**. Enforced by `okf.py lint` (required `type`; standards Prompt Card gate; trust-family shape).\n\n## Required frontmatter\n\n```yaml\n---\ntype: Concept          # Concept | Playbook | System | Reference | Incident\ntitle: Human-readable name\ndescription: One-line summary for indexes and pack/lookup\ntags: [kebab-case, topic]\nstatus: stable                                              # draft | stable | deprecated\ngenerated: { by: okf-agent/cursor, at: 2026-07-28T00:00:00Z }\n---\n```\n\nReserved by the spec: `type`, `title`, `description`, `resource`, `tags`, plus the `generated` / `verified` / `status` / `stale_after` / `sources` families. House extension: `pack_force_when` only.\n\n| Field | Rule |\n| --- | --- |\n| `type` | **MUST** \u2014 the one field OKF requires |\n| `title`, `description` | **MUST** for house docs (lint warns if missing) |\n| `tags` | **SHOULD**; house rules under `standards/` **MUST** include tag `standard` |\n| `resource` | Optional URL or vault-absolute path to the thing this concept describes. `Reference` concepts **SHOULD** set it (`DBG-311`); a non-URL, non-absolute value warns (`DBG-310`). `scrape` writes it |\n| `status` | **SHOULD** \u2014 `draft` \\| `stable` \\| `deprecated`. Absent means `stable`. Any other value warns (`DBG-314`) |\n| `generated` | **SHOULD** \u2014 `{ by, at }`. `by` **MUST** follow the actor convention (`DBG-313`) |\n| `verified` | Optional list (or a bare mapping) of `{ by, at }` confirmations |\n| `stale_after` | Optional `YYYY-MM-DD`. Past that date the content is stale (`DBG-315`) |\n| `sources` | Optional provenance list; each entry **MUST** carry `resource` (`DBG-316`) |\n| `pack_force_when` | House extension. Keyword list \u2014 pack force-includes when the query matches on **token boundaries** (multi-word keywords must match as a contiguous phrase). Prefer distinctive terms; a common English word will fire on unrelated queries |\n\n`timestamp` is **superseded** by `generated.at`. It still parses for legacy documents, but new work MUST NOT use it.\n\n## Trust is derived, never stored\n\nMost knowledge here is written by agents and then injected as binding cards. The spec's answer is to record *who* and let the consumer judge:\n\n| `verified` | Tier | Card shows |\n| --- | --- | --- |\n| absent | unverified | *(nothing \u2014 silent default)* |\n| non-`human:` actors only | machine-confirmed | `trust: machine-confirmed` |\n| any `human:<name>` actor | human-reviewed | *(nothing)* |\n\nActors follow one form: `human:<name>`, `process:<name>`, or `<agent>/<model>`. Unverified is silent so an all-agent vault does not tax every pack; machine-confirmed and stale still warn. Human review keeps the card quiet.\n\n## Cross-links are load-bearing\n\nLinks are not decoration. `compile` turns **every in-vault markdown link in the body** into a `graph.json` edge \u2014 a `# Related` section is the house convention for making them deliberate \u2014 and `pack` prints each card's neighbours as a `related:` line so the agent can traverse on to concepts the ranked pack did not include. A concept nothing links to is unreachable by traversal; lint flags orphans (`DBG-306`).\n\n## Prompt Cards\n\n- Binding standards (`standards/` or tag `standard`) **MUST** include a non-empty `## Prompt Card` (lint `DBG-308`).\n- Card body **SHOULD** be \u2264 ~600 characters (~150 tokens).\n- Other agent-facing concepts **SHOULD** ship a card.\n\n## Frontmatter parsing\n\nFrontmatter is real YAML, parsed by PyYAML when it is importable. **Without PyYAML** the kernel falls back to a flat subset \u2014 `key: value`, inline `key: [a, b]`, block lists \u2014 which cannot represent the nested families, so those documents are reported unparseable (`DBG-002`) rather than silently mangled. `okf.py capabilities` reports which path is live; the `nested_yaml` feature flag means the full parser is available.\n\nQuote scalars YAML reserves. `pack_force_when: [@workspace]` is invalid \u2014 `@` is a reserved indicator \u2014 and must \n\n\u2026"
    },
    {
      "id": "standards/okf-prompt-injection",
      "type": "Concept",
      "title": "OKF Prompt Injection",
      "description": "Rule",
      "tags": [
        "standard",
        "okf",
        "prompting",
        "tokens",
        "pack",
        "retrieval"
      ],
      "content": "# OKF Prompt Injection\n\nImplements **Rule #1 \u2014 Pack first** from [AGENTS.md](/AGENTS.md).\n\nCurated OKF stays in the vault. Generation context gets a **dynamic Prompt Pack**: slim `## Prompt Card` text from this task\u2019s `okf.py pack` \u2014 not a full-brain dump. `pack` also prints a one-line `caps:` header, so Capability Discovery and retrieval cost a single command.\n\n## Retrieval ladder\n\n| Priority | Lane | How | Use for |\n| :---: | :--- | :--- | :--- |\n| 1 | OKF | `okf.py pack` | Standards, playbooks, catalogs, pins on cards (+ `caps:` line) |\n| 2 | Traverse | Follow a card's `related:` / `source:` line | One deep dive |\n| 3 | Task corpus | Glob \u2192 **ripgrep (`rg`)** \u2192 Read | Product code in this repository (never legacy `grep`) |\n| 4 | Live external | Official Git/OCI/`gh` | Pins still missing/stale after 1\u20133 |\n| 5 | Grader | Only to explain/fix a failure | Not for inventing compliance at author time |\n\nLane 1 **MUST** run before corpus or authoring \u2014 once per task, not per message. Write-back durable pins/recipes to `_inbox/` (Rung 1); ingest via maintain playbook.\n\n**FORBIDDEN:** paste `graph.json` / full standards into the prompt; skip pack and grep the vault for compliance; invent stub designs that omit wiring the current Prompt Pack requires.\n\n## Traversal (lane 2)\n\nRanking picks the entry points; the **graph** carries you the rest of the way. Every card ends with the edges `compile` found in that concept's body (by convention, its `# Related` section):\n\n```text\nsource: https://upstream.example/docs/thing     # only when frontmatter sets `resource`\nrelated: standards/simplicity-first.md \u00b7 vault/concepts/okf-cognitive-bundle.md (+2 more)\n```\n\nNeighbours already in the pack are omitted, so every path listed is genuinely new reach. Open one **only** when the cards you hold do not answer the question \u2014 this is deliberate traversal, not a second search. Re-running `pack` instead of following an edge is the mistake this line exists to prevent.\n\nWhen the pack is empty, `_okf_knowledge/index.md` is the entry point for browsing the bundle by hand.\n\n## Empty packs\n\nAn empty pack is a **valid answer**: the vault holds nothing binding on this topic. Drop to lane 3 and proceed on general engineering judgement, then note anything durable for `_inbox/`. Re-running `pack` with reworded queries to force a hit is **FORBIDDEN** \u2014 it burns turns and invites an irrelevant card.\n\nRanked hits below `--min-score` (default 24) are dropped for this reason: a confidently-injected wrong card is worse than no card, because cards outrank the model's own judgement.\n\n## Budgets\n\n- Each card **SHOULD** be \u2264 ~600 characters (~150 tokens); lint warns above it.\n- A pack is capped at 8 cards and the `--budget` token ceiling (default ~1200). Cards are added in rank order until either limit is reached; a single oversized card is truncated rather than allowed to exceed the budget.\n- Concepts may set `pack_force_when: [keywords]`. Matching is on **token boundaries**, and multi-word keywords must appear as a contiguous phrase \u2014 so `tab` does not fire on `table`, and `deploy` does not fire on `deployment`.\n- `related:` lines cost ~8 tokens per link and are attached **after** card selection, so traversal never displaces a card. Set `related_links: 0` in `okf/config.py` to disable.\n\n## Prompt Card\n\n```text\nRule #1: okf.py pack before authoring \u2014 it prints caps + cards in one command.\nInject ## Prompt Card text only; empty pack is valid, do not re-query for a hit.\nNeed more? Follow a card's related:/source: edge \u2014 do not re-pack. Empty: index.md.\nLadder: OKF \u2192 traverse edges \u2192 repo corpus (rg) \u2192 live upstream \u2192 write-back _inbox.\nNo graph/index/full-doc paste; no grader mining to invent compliance.\n```\n\n# Related\n\n- DNA: [AGENTS.md](/AGENTS.md)\n- Schema: [OKF House Schema](okf-house-schema.md)\n- IDE tokens: [IDE Context Guardrails](ide-context-guardrails.md)\n- Pins / caches: [`vault/references/`](/vault/references/) (populate via scrape + maintain)"
    },
    {
      "id": "standards/python-naming",
      "type": "Concept",
      "title": "Python Naming",
      "description": "Binding single-style identifier rules for the OKF runtime package (PEP 8 snake_case).",
      "tags": [
        "standard",
        "python",
        "naming",
        "pep8",
        "conventions",
        "code-quality"
      ],
      "content": "# Python Naming\n\n**Binding** for `_okf_knowledge/kernel/okf/**/*.py` and `_okf_knowledge/kernel/okf.py`. Enforced by `okf.py lint` (`DBG-320`, `DBG-321`). Domain code outside this package SHOULD follow the same rules.\n\n## One style per name\n\nEvery identifier is **exactly one** of:\n\n| Style | Pattern | Used for |\n| --- | --- | --- |\n| `lower_snake` | `_?[a-z][a-z0-9_]*` | modules, files, functions, params, locals |\n| `UPPER_SNAKE` | `_?[A-Z][A-Z0-9_]*` | module constants only |\n| `CapWords` | `_?[A-Z][A-Za-z0-9]*` (no `_`) | classes and type aliases only |\n\n**Exception:** stdlib overrides that the runtime requires (e.g. `BaseHTTPRequestHandler.do_GET`) keep the upstream spelling.\n\n**Forbidden**\n\n- Mixing styles in one name (`MaxCards`, `VAULT_root`, `parseHTML`)\n- Product prefixes on identifiers (`okf_*`, `OKF_*`, `kernel_*`, `KERNEL_*`) \u2014 the package import `okf` is fine; prefixes on *variables* are not\n- `camelCase` functions or locals\n\nSchema keys in frontmatter (e.g. `okf_version`) are document fields, not Python identifiers \u2014 leave them alone.\n\n## Examples\n\n```python\n# good\nVAULT_ROOT = Path(\"...\")\nDEFAULT_MAX_CARDS = 8\nentry_script = brain / \"okf.py\"\n\nclass IndexEntry:\n    def score_hit(self, query: str) -> int: ...\n\n# bad\nokf_config = {}       # product prefix\nKERNEL_DIR = ...      # product prefix\nmaxCards = 8          # camelCase\nparseHTML = ...         # mixed\n```\n\n## Files\n\nPython modules and package data files use `lower_snake` (e.g. `paths.py`, `brain.html`).\n\n## Prompt Card\n\n```text\nOKF runtime Python: one style per name \u2014 lower_snake (funcs/locals/files),\nUPPER_SNAKE (constants), CapWords (classes/types only). Never mix; never okf_/kernel_ prefixes on identifiers. Lint: DBG-320 style, DBG-321 prefix.\n```\n\n# Related\n\n- [Metadata Headers](/standards/metadata-headers.md) \u2014 file/function header fields\n- [Simplicity First](/standards/simplicity-first.md)\n- [OKF House Schema](/standards/okf-house-schema.md)"
    },
    {
      "id": "standards/simplicity-first",
      "type": "Concept",
      "title": "Simplicity First (Laziness Ladder)",
      "description": "Prefer the simplest, shortest, minimal solution that works \u2014 reuse before new files before tooling.",
      "tags": [
        "standard",
        "simplicity",
        "laziness-ladder",
        "principles"
      ],
      "content": "# Laziness Ladder\n\nThe design lens applied *after* Rule #1 (Pack First) in [AGENTS.md](/AGENTS.md) \u2014 a lens, not a numbered rule. When multiple approaches solve the problem, pick the lowest rung that still works:\n\n| Rung | Approach | Example |\n|------|----------|---------|\n| 1 | Do nothing new | Reuse an existing concept, playbook, or reference |\n| 2 | Edit one file | Fix a link, add one paragraph, patch one script |\n| 3 | Add one small file | One new concept \u2014 not a new directory tree |\n| 4 | Add tooling | Only when manual steps repeat and hurt |\n| 5 | Add abstraction | Last resort \u2014 never start here |\n\n## In the vault\n\n- One concept per file; cross-link instead of duplicating prose.\n- Prefer `index.md` disclosure over bulk-reading the tree.\n- Kernel stays stdlib-only unless a dependency is unavoidable.\n- New types, directories, or tooling require justification against this ladder.\n\n## In code\n\n- Smallest diff that fixes the root cause \u2014 no drive-by refactors.\n- Match existing conventions before inventing new ones.\n\n## Prompt Card\n\n```text\nLaziness Ladder: reuse \u2192 one-file edit \u2192 one small file \u2192 tooling \u2192 abstraction last.\nSmallest diff; stdlib kernel; justify new dirs/types.\n```\n\n# Related\n\n- DNA: [AGENTS.md](/AGENTS.md)\n- Schema: [OKF House Schema](/standards/okf-house-schema.md)\n- Prompt discipline: [OKF Prompt Injection](/standards/okf-prompt-injection.md)"
    },
    {
      "id": "vault/concepts/extending-okf",
      "type": "Concept",
      "title": "Extending OKF",
      "description": "How to replicate this package and grow domain knowledge without rewriting the kernel.",
      "tags": [
        "okf-system",
        "getting-started",
        "portable"
      ],
      "content": "# Extending OKF\n\n**Package root:** directory containing [`AGENTS.md`](/AGENTS.md) and `_okf_knowledge/`. DNA lives in AGENTS.md; this page is how to ship and grow the package.\n\n## Replicate (copy-paste)\n\nCopy as a unit (keep relative layout):\n\n```\nAGENTS.md\n_okf_knowledge/\ntools/sync_skills.py\n.cursor/rules/okf.mdc\n.cursor/skills/{okf-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,okf-review}/\n.cursor/commands/{okf-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,okf-review}.md\n.github/skills/          # GENERATED \u2014 never edit by hand\n.github/prompts/{okf-discover,okf-pack,grill-me,mutation-gate,okf-writeback,okf-maintain,okf-review}.prompt.md\n.github/agents/okf.agent.md\n.github/copilot-instructions.md\n.github/instructions/okf-brain.instructions.md\n```\n\n`.cursor/skills/` is the single source of truth. Regenerate the Copilot copies with `python3 tools/sync_skills.py`; CI enforces it with `--check`.\n\nOptional CI: `.github/workflows/okf-lint.yml` runs compile, lint, the skill drift check, and the kernel tests.\n\nPlace at repo root or inside one folder (e.g. `agents/`). From package root:\n\n```bash\npython3 _okf_knowledge/kernel/okf.py compile\npython3 _okf_knowledge/kernel/okf.py lint\n```\n\nRequires Python 3.9+ (kernel is stdlib-only). Keep kernel + DNA; adapt domain cards under `standards/` and `vault/` for the target repo. Include Cursor / Copilot bindings as needed. If a parent workspace still points at legacy `knowledge/` / TOON paths, **this package\u2019s AGENTS.md wins** when `_okf_knowledge/` is present.\n\n## Add knowledge\n\n1. Drop raw notes in [`_inbox/`](/_inbox/).\n2. Follow [Maintain OKF System](/vault/playbooks/maintain-okf-system.md).\n\nA vault holding only OKF's own documentation makes Rule #1 pure overhead: every pack costs a command and returns nothing task-relevant. Fill `standards/` and `vault/` with the domain knowledge the target repo actually argues about \u2014 pinned versions, deployment runbooks, house policy \u2014 or expect empty packs and answer from general judgement.\n\n## Prompt Card\n\n```text\nReplicate: AGENTS.md + _okf_knowledge/ + tools/sync_skills.py + Cursor (.cursor) and Copilot (.github).\n.cursor/skills is the source of truth; .github/skills is generated (tools/sync_skills.py).\nFrom package root: compile + lint. Keep kernel + DNA; fill standards/ and vault/ with DOMAIN\nknowledge \u2014 a self-referential vault makes every pack empty and Rule #1 pure cost.\n```\n\n# Related\n\n- [AGENTS.md](/AGENTS.md)\n- [OKF Runtime CLI](/vault/systems/okf-runtime.md)\n- [Maintain OKF System](/vault/playbooks/maintain-okf-system.md)\n- [OKF Capability Discovery](/vault/concepts/okf-capability-discovery.md)"
    },
    {
      "id": "vault/concepts/okf-capability-discovery",
      "type": "Concept",
      "title": "OKF Capability Discovery",
      "description": "Probe Brain/FS/Python/Git/Shell before enabling pack/compile/lint; folded into pack as a one-line caps header.",
      "tags": [
        "okf-system",
        "capability",
        "discovery",
        "portable"
      ],
      "content": "# OKF Capability Discovery\n\nBinding policy (disable table, fallbacks, hard `BLOCKED` rule): **[`AGENTS.md`](/AGENTS.md)** \u00a7 Capability fallback. Skill recipe: `okf-discover`.\n\n## Normally you get this for free\n\n`okf.py pack` prints a capability line before the cards, so Rule #1 and discovery are one command and one round trip:\n\n```\ncaps: READY | all present | features: prompt_pack,vault_lookup,compile,lint,rung2_maintain,git_ops\n```\n\nRun the standalone command only when that line reports something other than `all present`, or when `okf.py` itself may be missing:\n\n```bash\npython3 _okf_knowledge/kernel/okf.py capabilities [--json] [--strict]\n```\n\nProbes `python`, `filesystem`, `shell`, `brain`, `git`, `compile`, `lint`. `--strict` exits `4` when the hint is `BLOCKED`. Enable **only** the features reported; capabilities do not change mid-session, so probing repeatedly is pure token cost.\n\n## Prompt Card\n\n```text\nCapabilities ride along with okf.py pack as a one-line \"caps:\" header \u2014 no separate call.\nOnly run okf.py capabilities when that line is not \"all present\" or okf.py may be missing.\nEnable only reported features; Brain missing on non-trivial mutate => BLOCKED. No tool assumptions.\n```\n\n# Related\n\n- [AGENTS.md](/AGENTS.md)\n- [OKF Prompt Injection](/standards/okf-prompt-injection.md)\n- [Extending OKF](extending-okf.md)"
    },
    {
      "id": "vault/concepts/okf-cognitive-bundle",
      "type": "Concept",
      "title": "OKF Cognitive Bundle",
      "description": "Modular OKF brain \u2014 atomic docs, index hub, inverted cache, prompt cards, autonomous okf.py.",
      "tags": [
        "okf",
        "architecture",
        "tokens",
        "bundle",
        "knowledge-format"
      ],
      "content": "# OKF Cognitive Bundle\n\nHow the Open Knowledge Format keeps agents **grounded** and **token-cheap**.\n\n## Pluggable modules\n\nA bundle is a version-controlled tree (`_okf_knowledge/` + DNA in `AGENTS.md`) you can drop into another team/repo. Zones:\n\n| Zone | Path | Role |\n| --- | --- | --- |\n| Inbox | `_inbox/` | Untriaged notes |\n| Kernel | `kernel/` | `okf.py` + compile/pack/lint |\n| Law | `standards/` | Binding MUST/SHOULD + Prompt Cards |\n| Memory | `vault/` | Concepts, playbooks, systems, incidents, references |\n\n## Atomic knowledge\n\nOne topic per markdown file with YAML frontmatter (`type`, `title`, `description`, `tags`, \u2026). Prefer small linked pages over monolithic dumps. Schema: [OKF House Schema](/standards/okf-house-schema.md).\n\n## Traversable graph\n\n[`index.md`](/index.md) is the hub. Use **explicit relative links** so agents map relationships without inventing neighbors from vector similarity alone. Compiled `graph.json` / `index.json` are for **tools**, not for pasting into prompts.\n\n## Token path\n\n```mermaid\nflowchart TB\n  User[User_Developer] --> Agent[AI_Agent]\n  Agent -->|\"okf.py pack/lookup\"| Okf[okf.py]\n  Okf --> Cache{JSON_index_cache}\n  Cache -->|hit| Idx[Inverted_index_lookup]\n  Cache -->|miss| Rg[\"ripgrep_rg_fallback\"]\n  Idx --> Card[Attach_Prompt_Card]\n  Rg --> Card\n  Card --> Json[Hyper_compressed_JSON]\n  Json --> Agent\n  Agent --> Task[Execute_or_Grill_Me]\n```\n\n1. `okf.py compile` \u2192 inverted `index.json` + `prompt_cards.json`\n2. `okf.py pack` \u2192 **cache hit:** instant inverted lookup; **cache miss / empty lexical hits:** **`rg` only** (never `grep`) over brain markdown\n3. Drop ranked hits below the relevance floor (`--min-score`, default 24), then attach mapped Prompt Cards up to 8 cards / the token budget\n4. **No card clears the floor \u2192 empty pack.** That is a real answer: the vault has nothing binding. Skip to step 6; do not reword and retry\n5. Optional deep read of paths the **current** cards name\n6. Repo corpus via targeted Glob/`rg`/Read\n7. Live upstream only on cache miss; write-back durable pins to `_inbox/`\n\nIDE-side bans and hygiene: [IDE Context Guardrails](/standards/ide-context-guardrails.md). Pack ladder: [OKF Prompt Injection](/standards/okf-prompt-injection.md).\n\n\n## Why JSON caches\n\nLocal inverted index and cards stay **JSON**. LLMs parse JSON reliably; custom/exotic wire formats (e.g. TOON as LLM ingest) add error and token overhead without helping pack quality.\n\n## Autonomy and grill-me\n\nAgents **SHOULD** run `compile` after durable brain mutations and may refresh indexes when files change. **Grill-me** remains a first-class multi-turn workflow \u2014 do not replace it with a rigid turn counter.\n\n## Prompt Card\n\n```text\nOKF bundle: atomic md + index.md links; pack cards only (no graph/index paste).\nLookup: JSON inverted hit \u2192 else ripgrep (rg), never grep \u2192 floor \u2192 Prompt Cards.\nEmpty pack = vault has nothing binding; proceed on judgement, do not re-query.\nGrill-me stays multi-turn; compile after brain mutations.\n```\n\n# Related\n\n- [Extending OKF](extending-okf.md)\n- [IDE Context Guardrails](/standards/ide-context-guardrails.md)\n- [Maintain OKF System](/vault/playbooks/maintain-okf-system.md)"
    },
    {
      "id": "vault/playbooks/maintain-okf-system",
      "type": "Playbook",
      "title": "Maintain OKF System",
      "description": "Add or update durable OKF knowledge \u2014 frontmatter, links, compile, lint.",
      "tags": [
        "okf-system",
        "ingest",
        "maintenance",
        "okf",
        "procedure"
      ],
      "content": "# Trigger\n\nAdd or change durable knowledge in this package: standard, concept, playbook, system, reference, or incident.\n\n# Preconditions\n\n- Raw material (if any) is in `_inbox/` and not edited in place.\n- You know the `type` and destination directory (table below).\n- Schema: [OKF House Schema](/standards/okf-house-schema.md).\n\n# Destination table\n\n| Content | `type` | Directory |\n| --- | --- | --- |\n| House rule | `Concept` + tag `standard` | `standards/` |\n| Evergreen fact | `Concept` | `vault/concepts/` |\n| Procedure | `Playbook` | `vault/playbooks/` |\n| Running system | `System` | `vault/systems/` |\n| Post-mortem | `Incident` | `vault/incidents/` |\n| Cached upstream / pins | `Reference` | `vault/references/` |\n\n# Steps\n\n1. Create/update one file with required frontmatter.\n2. Standards **MUST** include `## Prompt Card` (\u2264 ~600 chars).\n3. Cross-link both directions; update affected `index.md` files.\n4. Append a line to [log.md](/log.md).\n5. From **package root** (directory with `AGENTS.md`):\n\n```bash\npython3 _okf_knowledge/kernel/okf.py compile\npython3 _okf_knowledge/kernel/okf.py lint\n```\n\n6. Lint must report `0 error(s)`. Archive or delete the `_inbox/` source after successful ingest.\n\n# Change close-out write-back\n\nIf a non-trivial engineering change learned something durable: write `_inbox/<YYYY-MM-DD>-<slug>.md` (Rung 1). Run this playbook for Rung 2 only when destination is clear and the checklist above can finish; else leave `MAINTAIN later`.\n\n# Verification\n\n- [ ] Frontmatter valid\n- [ ] Indexes + cross-links updated\n- [ ] `compile` + `lint` clean\n- [ ] `log.md` updated\n\n## Prompt Card\n\n```text\nBrain mutate: correct type/dir; frontmatter; cross-links; index.md; log.md.\nStandards MUST ## Prompt Card. From package root: okf.py compile then lint (0 errors).\nClose-out: Rung 1 _inbox; Rung 2 only if this checklist finishes.\n```\n\n# Related\n\n- [AGENTS.md](/AGENTS.md)\n- [OKF House Schema](/standards/okf-house-schema.md)\n- [Extending OKF](/vault/concepts/extending-okf.md)"
    },

        if (cur.indent > baseIndent) {
          const nested = buildList(lines, i, baseId);
          if (items.length) items[items.length - 1].nested = nested.html;
          i = nested.next;
          continue;
        }
        items.push({ text: cur.text, extra: [], nested: "" });
        i++;
        while (i < lines.length) {
          if (parseListLine(lines[i])) break;
          const cont = lines[i].match(/^(\s+)(\S.*)$/);
          if (cont && cont[1].length > baseIndent) {
            items[items.length - 1].extra.push(cont[2].trim());
            i++;
          } else break;
        }
      }

      const body = items.map(it => {
        let inner = mdInline(it.text, baseId);
        if (it.extra.length) {
          inner += it.extra.map(t => `<span class="li-cont">${mdInline(t, baseId)}</span>`).join("");
        }
        return `<li>${inner}${it.nested}</li>`;
      }).join("");
      const tag = ordered ? "ol" : "ul";
      return { html: `<${tag}>${body}</${tag}>`, next: i };
    }

    /* Minimal markdown -> HTML: headings, fenced code, tables, lists, paragraphs. */
    function mdToHtml(md, baseId) {
      const lines = md.split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (line.trimStart().startsWith("```")) {
          const code = [];
          i++;
          while (i < lines.length && !lines[i].trimStart().startsWith("```")) code.push(lines[i++]);
          i++; // closing fence
          out.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }
        const h = line.match(/^(#{1,4})\s+(.*)/);
        if (h) {
          out.push(`<h${h[1].length}>${mdInline(h[2], baseId)}</h${h[1].length}>`);
          i++; continue;
        }
        if (line.trim().startsWith("|") && i + 1 < lines.length &&
          /^\s*\|[\s|:-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes("-")) {
          const cells = row => row.trim().replace(/^\||\|$/g, "").split("|").map(c => mdInline(c.trim(), baseId));
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
          out.push("<table><thead><tr>" + head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>" +
            rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
          continue;
        }
        if (parseListLine(line)) {
          const list = buildList(lines, i, baseId);
          out.push(list.html);
          i = list.next;
          continue;
        }
        if (!line.trim()) { i++; continue; }
        const para = [];
        while (i < lines.length && lines[i].trim() &&
          !/^(#{1,4}\s|\s*([-*]|\d+\.)\s|\s*\||\s*```)/.test(lines[i])) {
          para.push(lines[i++]);
        }
        if (para.length) out.push(`<p>${mdInline(para.join(" "), baseId)}</p>`);
        else i++;
      }
      return out.join("\n");
    }

    function renderReader() {
      const el = document.getElementById("reader");
      if (!readerOpen()) {
        el.style.display = "none";
        resize();
        return;
      }
      const n = selected;
      document.getElementById("r-title").innerHTML =
        `<span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${n.color};margin-right:6px"></span>` +
        escapeHtml(n.title || n.id);
      const tags = (n.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      document.getElementById("r-meta").innerHTML =
        `${escapeHtml(n.type)} &middot; ${escapeHtml(n.id)}.md` +
        (n.description ? `<div>${escapeHtml(n.description)}</div>` : "") +
        (tags ? `<div>${tags}</div>` : "");
      document.getElementById("r-body").innerHTML =
        n.content ? mdToHtml(n.content, n.id) : `<p style="color:var(--muted)">empty body</p>`;
      document.getElementById("r-body").scrollTop = 0;
      el.style.display = "flex";
      resize();
    }

    function closeReader() {
      selected = null;
      renderNavigator(); renderReader();
    }
    document.getElementById("r-close").addEventListener("click", closeReader);
    addEventListener("keydown", e => { if (e.key === "Escape" && readerOpen()) closeReader(); });
    /* Internal links inside rendered markdown jump to that concept's node. */
    document.getElementById("r-body").addEventListener("click", e => {
      const a = e.target.closest("a[data-node]");
      if (!a) return;
      e.preventDefault();
      const n = nodes.find(n => n.id === a.dataset.node);
      if (n) selectNode(n, true);
    });

    /* ---------- lint panel ---------- */

    function extractMdLinks(content) {
      const links = [];
      let m;
      const re = new RegExp(MD_LINK_RE.source, "g");
      while ((m = re.exec(content)) !== null) {
        const url = m[1];
        if (/^(https?|mailto|file):/i.test(url)) continue;
        links.push(url);
      }
      return links;
    }

    /* Mirror scripts/okf.py lint checks against the loaded graph (no index.md scan). */
    function runClientLint() {
      const findings = [];
      const inbound = new Set(edges.map(e => e.t.id));
      const add = (severity, concept, code, message) =>
        findings.push({ severity, concept, code, message });

      for (const n of nodes) {
        if (!String(n.type || "").trim())
          add("error", n.id, "DBG-301", "missing required 'type' field");
        if (n.type && !KNOWN_TYPES.has(n.type))
          add("warning", n.id, "DBG-302", `unknown type '${n.type}' (not in AGENTS.md taxonomy)`);
        if (!String(n.title || "").trim())
          add("warning", n.id, "DBG-303", "missing house-required field 'title'");
        if (!String(n.description || "").trim())
          add("warning", n.id, "DBG-303", "missing house-required field 'description'");
        for (const target of extractMdLinks(n.content || "")) {
          if (!target.endsWith(".md")) continue;
          if (!resolveMdLink(target, n.id))
            add("warning", n.id, "DBG-304", `broken link -> ${target}`);
        }
      }
      for (const n of nodes) {
        if (!inbound.has(n.id))
          add("warning", n.id, "DBG-306", "orphan — no inbound links in graph");
      }
      const errors = findings.filter(f => f.severity === "error").length;
      const warnings = findings.filter(f => f.severity === "warning").length;
      return {
        generated: new Date().toISOString(),
        source: "browser",
        summary: { concepts: nodes.length, errors, warnings },
        findings,
      };
    }

    /* ---------- local operations ----------
       This page is read-only. `okf.py serve` exposes no mutate endpoints, so
       lint runs entirely in the browser against the embedded graph. To rebuild
       the graph itself, run `okf.py compile` in a shell and reload. */

    function runLint() {
      const btn = document.getElementById("run-lint");
      if (!nodes.length) {
        statusEl.textContent = "load a graph first, then run lint";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Running…";
      try {
        setLint(runClientLint());
        statusEl.textContent = `${nodes.length} concepts — browser lint complete`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Run Lint";
      }
    }
    document.getElementById("run-lint").addEventListener("click", runLint);

    function renderLint() {
      const counts = document.getElementById("lintcounts");
      if (!lint) {
        counts.innerHTML = `<span class="cnt idle">lint —</span>`;
        counts.title = "Lint status";
        return;
      }
      const e = lint.summary.errors, w = lint.summary.warnings;
      counts.innerHTML = (e || w)
        ? `<span class="cnt err">${e} err</span> · <span class="cnt warn">${w} warn</span>`
        : `<span class="cnt ok">lint clean ✓</span>`;
      const src = lint.source === "vault" ? "vault scan" : "browser scan";
      const sample = (lint.findings || []).slice(0, 8).map(f =>
        `${f.severity === "error" ? "ERR" : "WARN"} ${f.concept}: [${f.code}] ${f.message}`
      ).join("\n");
      counts.title = sample
        ? `${src} · ${lint.generated}\n${sample}${(lint.findings.length > 8) ? "\n…" : ""}`
        : `${src} · ${lint.generated} · vault is conformant and healthy`;
    }

    /* ---------- force simulation & drawing ---------- */

    function neighborsOf(n) {
      const set = new Set();
      if (!n) return set;
      for (const e of edges) {
        if (e.s === n) set.add(e.t);
        if (e.t === n) set.add(e.s);
      }
      return set;
    }

    function visible(n) {
      if (hiddenTypes.has(n.type)) return false;
      if (opts.hideOrphans && n.deg === 0) return false;
      if (opts.localGraph && selected) {
        if (n === selected) return true;
        return neighborsOf(selected).has(n);
      }
      return true;
    }

    function shouldShowLabel(n, neighbors) {
      if (opts.labels === "off") return false;
      if (opts.labels === "always") return true;
      if (opts.labels === "hover") return n === hoverNode || n === selected;
      if (opts.labels === "selection") return n === selected || neighbors.has(n);
      return false;
    }

    function drawArrow(sx, sy, tx, ty, color) {
      const dx = tx - sx, dy = ty - sy;
      const d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      const tipX = tx - ux * 10 / view.k, tipY = ty - uy * 10 / view.k;
      const ax = -uy, ay = ux;
      const s = 4.5 / view.k;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(tx - ux * 4 / view.k, ty - uy * 4 / view.k);
      ctx.lineTo(tipX + ax * s, tipY + ay * s);
      ctx.lineTo(tipX - ax * s, tipY - ay * s);
      ctx.closePath();
      ctx.fill();
    }

    function step() {
      if (alpha > 0.005) {
        for (const e of edges) {
          if (!visible(e.s) || !visible(e.t)) continue;
          const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
          const d = Math.hypot(dx, dy) || 1;
          const f = (d - 140) * 0.018 * alpha;
          e.s.vx += dx / d * f; e.s.vy += dy / d * f;
          e.t.vx -= dx / d * f; e.t.vy -= dy / d * f;
        }
        for (let i = 0; i < nodes.length; i++) {
          if (!visible(nodes[i])) continue;
          for (let j = i + 1; j < nodes.length; j++) {
            if (!visible(nodes[j])) continue;
            const a = nodes[i], b = nodes[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            const d2 = dx * dx + dy * dy || 1;
            const f = Math.min(2800 / d2, 5) * alpha;
            const d = Math.sqrt(d2);
            a.vx -= dx / d * f; a.vy -= dy / d * f;
            b.vx += dx / d * f; b.vy += dy / d * f;
          }
        }
        for (const n of nodes) {
          if (!visible(n)) continue;
          n.vx -= n.x * 0.0015 * alpha; n.vy -= n.y * 0.0015 * alpha;
          if (n !== dragNode) { n.x += n.vx; n.y += n.vy; }
          n.vx *= 0.86; n.vy *= 0.86;
        }
        alpha *= 0.995;
      }
      if (tween) {
        view.x += (tween.tx - view.x) * 0.15;
        view.y += (tween.ty - view.y) * 0.15;
        view.k += (tween.tk - view.k) * 0.15;
        if (Math.abs(tween.tx - view.x) < .5 && Math.abs(tween.ty - view.y) < .5) tween = null;
      }
      draw();
      requestAnimationFrame(step);
    }

    function draw() {
      const { w, h } = graphSize();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#181818";
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.translate(view.x, view.y);
      ctx.scale(view.k, view.k);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      const neighbors = neighborsOf(selected);
      const focus = selected || hoverNode;
      const focusNeighbors = neighborsOf(focus);

      /* --- edges --- */
      for (const e of edges) {
        if (!visible(e.s) || !visible(e.t)) continue;
        const hot = focus && (e.s === focus || e.t === focus);
        const faded = focus && !hot;
        ctx.globalAlpha = faded ? 0.08 : 1;
        ctx.strokeStyle = hot ? "rgba(127,109,242,0.75)" : "rgba(160,160,160,0.22)";
        ctx.lineWidth = (hot ? 1.6 : 1) / view.k;
        ctx.beginPath();
        ctx.moveTo(e.s.x, e.s.y);
        ctx.lineTo(e.t.x, e.t.y);
        ctx.stroke();
        if (opts.arrows && !faded) {
          drawArrow(e.s.x, e.s.y, e.t.x, e.t.y, hot ? "rgba(127,109,242,0.85)" : "rgba(160,160,160,0.35)");
        }
        ctx.globalAlpha = 1;
      }

      /* --- nodes --- */
      for (const n of nodes) {
        if (!visible(n)) continue;
        const r = 5.5 + Math.min(n.deg, 12) * 1.1;
        const isFocus = n === focus;
        const isNear = focus && (n === focus || focusNeighbors.has(n));
        const faded = focus && !isNear;
        ctx.globalAlpha = faded ? 0.12 : 1;

        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fillStyle = n.color;
        ctx.fill();

        if (n.lint && !faded) {
          ctx.strokeStyle = n.lint === "error" ? "#f26d78" : "#f0c674";
          ctx.lineWidth = 2 / view.k;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r + 3 / view.k, 0, Math.PI * 2);
          ctx.stroke();
        }
        if (n === selected) {
          ctx.strokeStyle = "rgba(255,255,255,0.9)";
          ctx.lineWidth = 1.75 / view.k;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r + 5 / view.k, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (shouldShowLabel(n, neighbors) && view.k > 0.35) {
          const label = n.title || n.id;
          const fs = Math.max(11, Math.round(12 / Math.sqrt(Math.max(view.k, 0.5))));
          ctx.font = `500 ${fs / view.k}px system-ui, -apple-system, "Segoe UI", sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillText(label, n.x + r + 6 / view.k + 0.7 / view.k, n.y + 0.7 / view.k);
          ctx.fillStyle = isFocus || isNear ? "rgba(255,255,255,0.95)" : "rgba(220,220,220,0.82)";
          ctx.fillText(label, n.x + r + 6 / view.k, n.y);
        }
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    /* ---------- pointer interaction ---------- */

    function toWorld(px, py) { return { x: (px - view.x) / view.k, y: (py - view.y) / view.k }; }
    function nodeAt(px, py) {
      const p = toWorld(px, py);
      return nodes.find(n => visible(n) &&
        Math.hypot(n.x - p.x, n.y - p.y) < (8 + Math.min(n.deg, 10) * 1.35) + 5 / view.k);
    }

    canvas.addEventListener("mousedown", e => {
      const p = pointer(e);
      const n = nodeAt(p.x, p.y);
      if (n) { dragNode = n; alpha = Math.max(alpha, 0.3); }
      else panning = true;
      moved = false; tween = null;
      last = { x: e.clientX, y: e.clientY };
    });
    addEventListener("mousemove", e => {
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      if (dragNode) { dragNode.x += dx / view.k; dragNode.y += dy / view.k; moved = moved || dx || dy; }
      else if (panning) { view.x += dx; view.y += dy; moved = moved || dx || dy; }
      else {
        const p = pointer(e);
        const n = nodeAt(p.x, p.y);
        hoverNode = n || null;
        if (n) {
          const lintLine = n.lint
            ? `<div class="t-lint ${n.lint}">${n.lint === "error" ? "has lint errors" : "has lint warnings"}</div>` : "";
          tip.style.display = "block";
          tip.style.left = (e.clientX + 14) + "px";
          tip.style.top = (e.clientY + 14) + "px";
          tip.innerHTML = `<div class="t-title">${escapeHtml(n.title || n.id)}</div>` +
            `<div class="t-meta">${escapeHtml(n.type)} &middot; ${escapeHtml(n.id)}.md &middot; ${n.deg} link(s)</div>` + lintLine;
          canvas.style.cursor = "pointer";
        } else { tip.style.display = "none"; canvas.style.cursor = panning ? "grabbing" : "default"; }
      }
      last = { x: e.clientX, y: e.clientY };
    });
    addEventListener("mouseup", e => {
      if (dragNode && !moved) selectNode(dragNode, false);
      else if (panning && !moved && e.target === canvas) {
        selected = null; resize();
        renderNavigator(); renderReader();
      }
      dragNode = null; panning = false;
    });
    canvas.addEventListener("wheel", e => {
      e.preventDefault(); tween = null;
      const p = pointer(e);
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      const world = toWorld(p.x, p.y);
      view.k = Math.min(4, Math.max(0.2, view.k * factor));
      view.x = p.x - world.x * view.k;
      view.y = p.y - world.y * view.k;
    }, { passive: false });

    resize();
    step();
  </script>
</body>

</html>
