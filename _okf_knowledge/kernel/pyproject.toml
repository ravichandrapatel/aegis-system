[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf"
version = "1.9.0"
description = "OKF knowledge runtime — pack, compile, lint, scrape, serve"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "contributors" }]
dependencies = []
optional-dependencies = { yaml = ["PyYAML>=6.0"], tokens = ["tiktoken>=0.7.0"] }

[project.scripts]
okf = "okf.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["okf*"]

[tool.setuptools.package-data]
okf = ["assets/*"]
